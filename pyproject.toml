[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "21cmMC"
description = "Bayesian inference for 21cmFAST and the 21-cm signal."
authors = [
    {name="Brad Greig", email="greigb@unimelb.edu.au"},
    {name="Steven Murray", email='steven.murray@sns.it'},
]
readme = "README.rst"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
]
# Dependencies are added with the code that needs them (M1 onwards).
dependencies = [
    "numpy",
]
dynamic = [
    "version",
]

[project.optional-dependencies]
# 21cmFAST needs GSL and FFTW to build; the fast test tier runs without it.
21cmfast = [
    "21cmFAST>=4.3.1,<4.4",
]

[project.urls]
Repository = "https://github.com/21cmfast/21CMMC"
Issues = "https://github.com/21cmfast/21CMMC/issues"
Changelog = "https://github.com/21cmfast/21CMMC/blob/main/CHANGELOG.rst"

[dependency-groups]
tests = [
    "pytest>=8",
    "pytest-cov",
]
docs = [
    "sphinx",
    "furo",
]
dev = [
    {include-group = "tests"},
    {include-group = "docs"},
    "pre-commit",
    "ruff",
]

[tool.setuptools_scm]
version_file = "src/py21cmmc/_version.py"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "nightly: needs 21cmFAST or a full simulation; runs in the Nightly workflow",
]

[tool.coverage.run]
# Written by setuptools-scm at install time.
omit = ["*/_version.py"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
  "*.ipynb",
]

[tool.ruff.lint]
extend-select = [
  "UP",   # pyupgrade
  "E",    # pycodestyle
  "W",    # pycodestyle warning
  "F",    # pyflakes
  "C90",  # mccabe complexity
  "I",    # isort
  "N",    # pep8-naming
  "D",    # docstyle
  # "ANN"   # type annotations
  "B",    # bugbear
  "A",    # builtins
  "C4",   # comprehensions
  "DTZ",  # datetime
  "FA",   # future annotations
  "PIE",  # flake8-pie
  "T",    # print statements
  "PT",   # pytest-style
  "Q",    # quotes
  "SIM",  # simplify
  "PTH",  # use Pathlib
  "ERA",  # kill commented code
  "NPY",  # numpy-specific rules
  "PERF", # performance
  # "FURB", # refurb
  "RUF",  # ruff-specific rules
]
ignore = [
    "DTZ007",   # use %z in strptime
    "DTZ005",
    "E203",
    "E266",
    "E501",
    "F403",
    #"F401",
    "E231",
    # Naming upper/lowercase -- too hard right now.
    "N803",
    # Naming upper/lowercase -- too hard right now.
    "N806",
    # Naming upper/lowercase -- too hard right now.
    "N802",
    # Naming mixed case
    "N815",
    # Docstring in imperative mood. This should *not* be the case for @property's, but can't ignore them atm.
#    "D401",
    # Module shadowing a builtin
    "A005",
    "RUF009",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "D103",  # ignore missing docstring in tests
    "DTZ",   # ignore datetime in tests
    "T",     # print statements
    # `pytest.fixture` is listed in lint.pydocstyle.property-decorators (so that
    # fixtures get the relaxed docstring treatment properties get), but that
    # option is also consulted by PLR0206, which then wrongly treats pytest
    # fixtures as properties and flags their (perfectly normal) parameters.
    "PLR0206",
    # Tests intentionally use broad `pytest.raises(ValueError)` without `match=`,
    # and some raises-blocks contain more than one statement (e.g. building an
    # object then asserting the call raises).
    "PT011",
    "PT012",
]
"docs/conf.py" = [
    "A",  # conf.py can shadow builtins
    "ERA",
]

[tool.ruff.lint.pydocstyle]
convention = 'numpy'
property-decorators = [
    "property",
    "cached_property",
    "pytest.fixture"
]

[tool.ruff.lint.mccabe]
max-complexity = 21
