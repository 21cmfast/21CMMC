name: test-suite
channels:
  - conda-forge
  - conda-forge/label/cf201901
  - defaults
dependencies:
  - pytest>=5.0
  - pytest-cov
  - pytest-remotedata>=0.3.2
  - click
  - numpy
  - pyyaml
  - cffi>=1.0
  - scipy
  - astropy>=2.0
  - h5py>=2.8.0
  # matplotlib is capped below 3.9 because that release removed
  # plt.register_cmap, which is still used by 21cmFAST<4.0.0's plotting
  # module. Revisit once 21cmFAST is upgraded past v4.
  - matplotlib<3.9
  - multinest
  - ultranest
  - pymultinest
  - zeus-mcmc
  - pip
  - 21cmFAST

  - pip:
    - powerbox
    - cached_property
    - pre-commit
