name: test-suite
channels:
  - conda-forge
  - conda-forge/label/cf201901
  - defaults
dependencies:
  - pytest>=5.0
  - pytest-cov
  - pytest-remotedata>=0.3.2
  - click
  - numpy
  - pyyaml
  - cffi>=1.0
  - scipy
  - astropy>=2.0
  - h5py>=2.8.0
  - matplotlib
  - multinest
  - ultranest
  - pymultinest
  - nautilus-sampler
  - zeus-mcmc
  - pip
  - 21cmFAST

  - pip:
    - powerbox
    - cached_property
    - pre-commit
    # tuesday-eor and pspec-likelihood are unconditionally/optionally
    # imported by py21cmmc.core / py21cmmc.likelihood respectively, and
    # aren't available on conda-forge, so they must be installed via pip.
    - tuesday-eor
    - pspec-likelihood
