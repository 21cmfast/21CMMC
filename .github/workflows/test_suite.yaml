name: Tests

# Test on all pushes, except when the push is literally just a tag (because we
# tag automatically via CI, and therefore there's no extra code in that push).
# Also, only test on pull requests into master.
on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - 'master'
      - 'main'


jobs:
  tests:
    if: "!contains(github.event.pull_request.labels.*.name, 'auto-pr')"
    env:
      ENV_NAME: test-suite
      PYTHON: ${{ matrix.python-version }}
      OS: ${{ matrix.os }}
    name: Testing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        # Adding -l {0} ensures conda can be found properly in each step
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,defaults
          activate-environment: ${{ env.ENV_NAME }}
          channel-priority: strict

      - name: Conda Info
        run: |
          conda info -a
          conda list
          PYVER=`python -c "import sys; print('{:d}.{:d}'.format(sys.version_info.major, sys.version_info.minor))"`
          if [[ $PYVER != $PYTHON ]]; then
            exit 1;
          fi

      # 21cmFAST is a direct (core) dependency of 21CMMC, pinned to <4.0.0 since
      # this codebase does not yet support 21cmFAST v4. It has heavy non-python
      # compiled dependencies (FFTW, GSL) that are best installed via conda, and
      # then built against when pip builds 21cmFAST from source below. MultiNest
      # (the native library used by pymultinest) is also only installable via
      # conda.
      - name: Install Non-Python Dependencies
        run: |
          conda install pip fftw gsl compilers pkg-config multinest

      - name: Install 21CMMC
        run: |
          echo $(which pip)
          pip install ".[test,samplers]"

      - name: List Environment
        run: |
          conda list

      - name: Run Tests
        # KMP_DUPLICATE_LIB_OK works around an OpenMP "already initialized"
        # abort (SIGABRT / exit 134) seen on macOS. Building 21cmFAST from
        # source here (rather than installing a prebuilt conda-forge binary)
        # links it against conda's own OpenMP runtime, which can conflict
        # with the bundled OpenMP runtime shipped inside torch (imported in
        # tests/conftest.py) even though that file already imports torch
        # first to mitigate this. Setting this env var makes the duplicate
        # runtime a non-fatal warning instead of a hard abort.
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: |
          python -m pytest --cov=py21cmmc --cov-config=.coveragerc -vv --cov-report xml:./coverage.xml --durations=25

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
