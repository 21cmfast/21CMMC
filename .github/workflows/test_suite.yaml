name: Tests

# Test on all pushes, except when the push is literally just a tag (because we
# tag automatically via CI, and therefore there's no extra code in that push).
# Also, only test on pull requests into master.
on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - 'master'
      - 'main'


jobs:
  tests:
    if: "!contains(github.event.pull_request.labels.*.name, 'auto-pr')"
    env:
      ENV_NAME: test-suite
      PYTHON: ${{ matrix.python-version }}
      OS: ${{ matrix.os }}
    name: Testing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 21cmFAST v3 has no conda-forge build for Apple silicon (osx-arm64), so
        # macOS runs on the Intel runner (available until the macOS 15 image is
        # retired in fall 2027).
        os: [ubuntu-latest, macos-15-intel]
        # tuesday-eor (a new hard dependency, needed by py21cmmc.core) requires
        # Python >=3.10, and pyproject.toml's requires-python has been bumped
        # to match, so 3.8/3.9 are no longer supported. 21cmFAST v3 on conda-forge
        # has builds up to Python 3.11, and pspec_likelihood (see ci/test-env.yml)
        # needs Python >= 3.11, so only 3.11 is tested.
        python-version: ["3.11"]
    defaults:
      run:
        # Adding -l {0} ensures conda can be found properly in each step
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache conda
        uses: actions/cache@v6
        env:
          # Increase this value to reset cache if ci/test-env.yml has not changed
          CACHE_NUMBER: 0
        with:
          path: ~/conda_pkgs_dir
          key:
            ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{ matrix.python-version }}-${{ hashFiles('ci/test-env.yml') }}

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          # Miniforge: conda-forge only, no Anaconda defaults channel (and its terms of service)
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          environment-file: ci/test-env.yml
          activate-environment: ${{ env.ENV_NAME }}
          channel-priority: strict

      - name: Conda Info
        run: |
          conda info -a
          conda list
          PYVER=`python -c "import sys; print('{:d}.{:d}'.format(sys.version_info.major, sys.version_info.minor))"`
          if [[ $PYVER != $PYTHON ]]; then
            exit 1;
          fi

      - name: Install 21CMMC
#        if: matrix.os == 'ubuntu-latest'
        run: |
          echo $(which pip)
          pip install .[test]

      - name: List Environment
        run: |
          conda list

      - name: Run Tests
        run: |
          python -m pytest --cov=py21cmmc --cov-config=.coveragerc -vv --cov-report xml:./coverage.xml --durations=25

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
