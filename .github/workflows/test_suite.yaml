name: Tests

# Test on all pushes, except when the push is literally just a tag (because we
# tag automatically via CI, and therefore there's no extra code in that push).
# Also, only test on pull requests into master.
on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - 'master'
      - 'main'


jobs:
  tests:
    if: "!contains(github.event.pull_request.labels.*.name, 'auto-pr')"
    env:
      ENV_NAME: test-suite
      PYTHON: ${{ matrix.python-version }}
      OS: ${{ matrix.os }}
    name: Testing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # NOTE: pinned to macos-13 (Intel) rather than macos-latest, because
        # macos-latest now points to Apple Silicon (osx-arm64) runners, and
        # the 21cmfast conda-forge package does not currently publish
        # osx-arm64 builds (only linux-64 and osx-64). Revisit once
        # conda-forge/21cmfast-feedstock adds osx-arm64 support.
        os: [ubuntu-latest, macos-13]
        # NOTE: 3.12 is excluded because the 21cmfast conda-forge package's
        # latest release (3.3.1) does not provide a Python 3.12 build.
        # Revisit once a newer 21cmfast conda-forge release supports 3.12.
        python-version: ["3.10", "3.11"]
    defaults:
      run:
        # Adding -l {0} ensures conda can be found properly in each step
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          python-version: ${{ matrix.python-version }}
          environment-file: ci/test-env.yml
          activate-environment: ${{ env.ENV_NAME }}
          channel-priority: strict

      - name: Conda Info
        run: |
          conda info -a
          conda list
          PYVER=`python -c "import sys; print('{:d}.{:d}'.format(sys.version_info.major, sys.version_info.minor))"`
          if [[ $PYVER != $PYTHON ]]; then
            exit 1;
          fi

      # 21cmFAST is a direct (core) dependency of 21CMMC, pinned to <4.0.0 since
      # this codebase does not yet support 21cmFAST v4. It is provided here via
      # ci/test-env.yml since it has non-python compiled dependencies.
      - name: Install 21CMMC
        run: |
          echo $(which pip)
          pip install .[test]

      - name: List Environment
        run: |
          conda list

      - name: Run Tests
        run: |
          python -m pytest --cov=py21cmmc --cov-config=.coveragerc -vv --cov-report xml:./coverage.xml --durations=25

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
