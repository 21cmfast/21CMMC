name: Tests

# The fast tier: lint, the tests that don't need 21cmFAST, and a build check. Runs on
# every push (except bare tag pushes) and pull request. Tests that need 21cmFAST are
# marked `nightly` and run in nightly.yaml.
on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: ruff check
        run: uvx ruff check .
      - name: ruff format
        run: uvx ruff format --check .

  tests:
    name: Fast tier (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --group tests
      - name: Run tests
        run: uv run pytest --cov=py21cmmc --cov-report=xml:coverage.xml --durations=25
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: fast
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Build sdist and wheel
        run: uv build
      - name: twine check
        run: uvx twine check --strict dist/*
