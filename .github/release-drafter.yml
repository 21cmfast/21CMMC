# Configuration for release-drafter (https://github.com/release-drafter/release-drafter),
# run by .github/workflows/release-draft.yml. Adapted (trimmed) from
# 21cmFAST's .github/release-drafter.yml to match the label set in
# .github/labels.yml.

autolabeler:
  - label: "type: maint: documentation"
    files:
      - "*.md"
      - "*.rst"
      - "docs/**/*"
    branch:
      - "/.*docs{0,1}.*/"
  - label: "type: bug"
    branch:
      - "/fix.*/"
    title:
      - "/fix/i"
  - label: "type: maint: removal"
    title:
      - "/remove .*/i"
  - label: "type: ci"
    files:
      - ".github/*"
      - ".pre-commit-config.yaml"
      - ".coveragerc"
    branch:
      - "/pre-commit-ci-update-config/"
  - label: "type: maint: style"
    files:
      - "/pre-commit-ci-update-config/"
  - label: "type: maint: refactoring"
    title:
      - "/.* refactor.*/i"

template: |
  ## Changes

  $CHANGES

categories:
  - title: ":boom: Breaking Changes"
    labels:
      - "API breaking"
  - title: ":rocket: Features"
    labels:
      - "type: feature"
  - title: ":fire: Removals and Deprecations"
    labels:
      - "type: maint: removal"
  - title: ":beetle: Fixes"
    labels:
      - "type: bug"
  - title: ":racehorse: Performance"
    labels:
      - "type: performance"
  - title: ":rotating_light: Testing"
    labels:
      - "type: testing"
  - title: ":construction_worker: Continuous Integration"
    labels:
      - "type: ci"
  - title: ":books: Documentation"
    labels:
      - "type: maint: documentation"
  - title: ":hammer: Refactoring"
    labels:
      - "type: maint: refactoring"
  - title: ":lipstick: Style"
    labels:
      - "type: maint: style"
  - title: ":package: Dependencies"
    labels:
      - "type: maint: dependencies"
      - "type: maint: build"

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
